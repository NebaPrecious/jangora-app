<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/currency"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="income-page">

  <div class="container">

    <div class="progress-text">
      Step 3 of 5
    </div>

    <ion-progress-bar
      value="0.6"
      color="success">
    </ion-progress-bar>

    <h1 class="title">
      What's your monthly income range?
    </h1>

    <p class="subtitle">
      This helps us create realistic savings and budgeting plans.
    </p>

    <div class="income-list">

      <div
        class="income-card"
        *ngFor="let range of incomeRanges"
        [class.selected]="selectedIncome === range"
        (click)="selectIncome(range)">
        {{ range }}
      </div>

    </div>

  </div>

</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <ion-button
      expand="block"
      [disabled]="!selectedIncome || isNavigating"
      (click)="continue()">
      Continue
    </ion-button>
  </ion-toolbar>
</ion-footer>
