<ion-header [translucent]="true" class="jangora-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/expenses"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Edit Expense' : 'Add Expense' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="expense-form-page">
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <div class="form-container">
    <div class="form-heading">
      <p>{{ isEditMode ? 'Update spending' : 'New spending' }}</p>
      <h1>{{ isEditMode ? 'Refine this expense' : 'Track an expense' }}</h1>
    </div>

    <div class="state-card" *ngIf="isLoading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading expense...</p>
    </div>

    <form *ngIf="!isLoading" (ngSubmit)="save()" #expenseForm="ngForm" novalidate>
      <label class="field amount-field">
        <span>Amount</span>
        <div>
          <ion-icon name="cash-outline"></ion-icon>
          <input
            type="number"
            name="amount"
            inputmode="decimal"
            min="0.01"
            step="0.01"
            required
            [(ngModel)]="form.amount"
            placeholder="0.00" />
        </div>
      </label>

      <div class="field-grid">
        <div class="field option-field">
          <span>Currency</span>
          <button type="button" class="option-trigger" (click)="toggleOptions('currency')">
            {{ form.currency }}
          </button>
          <div class="option-list" *ngIf="expandedOptions === 'currency'">
            <button
              type="button"
              *ngFor="let currency of currencies"
              [class.selected]="form.currency === currency"
              (click)="selectCurrency(currency)">
              {{ currency }}
            </button>
          </div>
        </div>

        <div class="field option-field">
          <span>Category</span>
          <button type="button" class="option-trigger" (click)="toggleOptions('category')">
            {{ form.category }}
          </button>
          <div class="option-list" *ngIf="expandedOptions === 'category'">
            <button
              type="button"
              *ngFor="let category of categories"
              [class.selected]="form.category === category"
              (click)="selectCategory(category)">
              {{ category }}
            </button>
          </div>
        </div>
      </div>

      <div class="field-grid">
        <label class="field">
          <span>Date</span>
          <input type="date" name="date" required [(ngModel)]="form.date" />
        </label>

        <label class="field">
          <span>Time</span>
          <input type="time" name="time" required [(ngModel)]="form.time" />
        </label>
      </div>

      <label class="field">
        <span>Note</span>
        <textarea
          name="note"
          maxlength="240"
          rows="4"
          [(ngModel)]="form.note"
          placeholder="Optional note"></textarea>
      </label>

      <label class="toggle-row">
        <div>
          <span>Recurring expense</span>
          <p>Repeat this expense in your records.</p>
        </div>
        <input type="checkbox" name="isRecurring" [(ngModel)]="form.isRecurring" (change)="handleRecurringChange()" />
      </label>

      <div class="field option-field" *ngIf="form.isRecurring">
        <span>Repeats</span>
        <button type="button" class="option-trigger" (click)="toggleOptions('recurrence')">
          {{ form.recurrenceType }}
        </button>
        <div class="option-list" *ngIf="expandedOptions === 'recurrence'">
          <button
            type="button"
            *ngFor="let recurrenceType of recurrenceTypes"
            [class.selected]="form.recurrenceType === recurrenceType"
            (click)="selectRecurrenceType(recurrenceType)">
            {{ recurrenceType }}
          </button>
        </div>
      </div>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="button-row">
        <button type="button" class="secondary-button" (click)="cancel()" [disabled]="isSaving">Cancel</button>
        <button type="submit" class="primary-button" [disabled]="isSaving">
          <ion-spinner *ngIf="isSaving" name="crescent"></ion-spinner>
          <span>{{ isSaving ? 'Saving Expense...' : (isEditMode ? 'Save Changes' : 'Save Expense') }}</span>
        </button>
      </div>
    </form>
  </div>
</ion-content>
