<ion-content [fullscreen]="true" class="dashboard-section-page">
  <div class="glow glow-one" aria-hidden="true"></div>
  <div class="glow glow-two" aria-hidden="true"></div>

  <main class="section-container">
    <header class="section-header">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>{{ sectionTitle }}</h1>
        <p class="section-subtitle">{{ sectionDescription }}</p>
      </div>

      <div class="section-icon">
        <ion-icon [name]="sectionIcon" aria-hidden="true"></ion-icon>
      </div>
    </header>

    <div class="quick-actions" *ngIf="showQuickActions">
      <button
        type="button"
        class="quick-action"
        *ngFor="let action of quickActions"
        (click)="handleQuickAction(action.action)">
        <span class="quick-icon">
          <ion-icon [name]="action.icon" aria-hidden="true"></ion-icon>
        </span>
        <span>{{ action.label }}</span>
      </button>
    </div>

    <section class="section-card" aria-live="polite">
      <div class="card-header">
        <div>
          <p>Coming soon</p>
          <h2>{{ sectionTitle }} isn't available yet</h2>
        </div>
        <div class="card-badge">
          <ion-icon name="sparkles-outline" aria-hidden="true"></ion-icon>
        </div>
      </div>

      <p class="section-card-body">
        {{ sectionDescription }} We're still building this part of Jangora, so there's nothing
        to show here yet.
      </p>

      <button type="button" class="primary-action" (click)="goHome()">Back to Home</button>
    </section>
  </main>

  <app-dashboard-tabs></app-dashboard-tabs>
</ion-content>
